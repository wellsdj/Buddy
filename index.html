<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Deskmate</title>
<style>
  :root {
    --bg: #0d1014;
    --panel: #161b22;
    --line: #232a33;
    --text: #c8d2de;
    --dim: #6b7684;
    --glow: #58c9ff;
    --warm: #ffb454;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 14px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    overflow: hidden;
    -webkit-user-select: none;
    user-select: none;
  }

  canvas#face {
    display: block;
    width: min(72vmin, 520px);
    height: min(72vmin, 520px);
    cursor: pointer;
  }

  /* Everything that isn't the circle fades out once you stop touching it. */
  .chrome {
    transition: opacity .7s ease;
    opacity: 1;
  }
  body.quiet .chrome { opacity: 0; }
  body.quiet { cursor: none; }

  #status {
    height: 20px;
    color: var(--dim);
    letter-spacing: .14em;
    text-transform: uppercase;
    font-size: 11px;
  }
  #status.live { color: var(--glow); opacity: 1; }

  #said {
    max-width: 560px;
    min-height: 44px;
    text-align: center;
    padding: 0 16px;
    font-size: 15px;
  }
  #said .you { color: var(--dim); }

  #bar {
    display: flex;
    gap: 8px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 6px 8px;
  }
  button {
    font: inherit;
    font-size: 12px;
    color: var(--text);
    background: transparent;
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 6px 14px;
    cursor: pointer;
    touch-action: manipulation;
  }
  button:hover { border-color: var(--dim); }
  button.on { color: var(--bg); background: var(--glow); border-color: var(--glow); }

  #hint { color: var(--dim); font-size: 11px; text-align: center; padding: 0 12px; }
  #hint kbd {
    border: 1px solid var(--line);
    border-bottom-width: 2px;
    border-radius: 4px;
    padding: 1px 5px;
    color: var(--text);
  }

  #cost {
    position: fixed; top: 14px; right: 16px;
    color: var(--dim); font-size: 11px; text-align: right; line-height: 1.7;
  }
  #cost b { color: var(--warm); font-weight: normal; }

  #cam {
    position: fixed; top: 14px; left: 16px;
    width: 128px; border-radius: 8px; border: 1px solid var(--line);
    display: none; transform: scaleX(-1);
  }
  #cam.on { display: block; }

  dialog {
    background: var(--panel); color: var(--text); border: 1px solid var(--line);
    border-radius: 12px; padding: 22px; width: min(460px, 92vw); font: inherit;
  }
  dialog::backdrop { background: #000a; }
  dialog h2 { font-size: 14px; font-weight: normal; margin-bottom: 4px; }
  dialog p { color: var(--dim); font-size: 12px; margin-bottom: 16px; }
  label { display: block; font-size: 11px; color: var(--dim); margin: 12px 0 4px; }
  input, select {
    width: 100%; font: inherit; font-size: 16px; color: var(--text);
    background: var(--bg); border: 1px solid var(--line);
    border-radius: 6px; padding: 8px 10px;
  }
  .row { display: flex; gap: 8px; justify-content: flex-end; margin-top: 20px; }

  #approve {
    position: fixed; inset: auto 0 0 0; padding: 16px;
    display: none; justify-content: center;
  }
  #approve.on { display: flex; opacity: 1; }
  #approve .card {
    background: var(--panel); border: 1px solid var(--warm);
    border-radius: 10px; padding: 14px 16px; max-width: 560px; width: 100%;
  }
  #approve .what { color: var(--warm); font-size: 12px; margin-bottom: 8px; }
  #approve pre { font-size: 12px; white-space: pre-wrap; max-height: 120px; overflow: auto; margin-bottom: 12px; }
</style>
</head>
<body>

<img id="cam" alt="">
<div id="cost" class="chrome">session <b id="c-turns">0</b> turns<br>~<b id="c-spend">$0.0000</b></div>

<canvas id="face" width="560" height="560"></canvas>
<div id="status" class="chrome">asleep</div>
<div id="said" class="chrome"></div>

<div id="bar" class="chrome">
  <button id="talk">Hold to talk</button>
  <button id="eye">Eyes</button>
  <button id="cfg">Brain</button>
</div>
<div id="hint" class="chrome">hold <kbd>space</kbd> to talk &middot; <kbd>esc</kbd> to interrupt</div>

<div id="approve" class="chrome"><div class="card">
  <div class="what" id="ap-what"></div>
  <pre id="ap-body"></pre>
  <div class="row"><button id="ap-no">Nope</button><button id="ap-yes" class="on">Do it</button></div>
</div></div>

<dialog id="dlg">
  <h2>Where does the thinking happen?</h2>
  <p>Speech in and out is free &mdash; your browser does it. This is the only part that costs money. Your key is kept in this browser only, and goes nowhere except the endpoint you name.</p>
  <label for="d-mode">Brain</label>
  <select id="d-mode">
    <option value="demo">Demo &mdash; no key, canned replies, free</option>
    <option value="anthropic">Anthropic API</option>
    <option value="openai">OpenAI-compatible (OpenAI, Groq, Ollama&hellip;)</option>
  </select>
  <div id="d-remote" hidden>
    <label for="d-url">Endpoint</label><input id="d-url" spellcheck="false">
    <label for="d-model">Model</label><input id="d-model" spellcheck="false">
    <label for="d-key">API key <span id="d-keynote"></span></label>
    <input id="d-key" type="password" spellcheck="false" placeholder="sk-&hellip;">
  </div>
  <div class="row"><button id="d-close">Close</button><button id="d-save" class="on">Save</button></div>
</dialog>

<script>
// ---------------------------------------------------------------- the face --
const cv = document.getElementById('face');
const cx = cv.getContext('2d');
const R = cv.width / 2;

// Three strokes: two eyes and a mouth. Each mood sets where those strokes want
// to be, and the draw loop eases toward them, so there are no transitions to
// write by hand — change a number and the personality changes.
//
//   eyeW    half-length of an eye stroke
//   eyeBow  eye curvature; negative arcs up (content), positive droops
//   lift    raises or lowers the outer end of each eye, which is the eyebrow
//   bow     mouth curvature; negative frowns
//   open    how far the mouth is apart at rest
//   glow    how lit the strokes are
const MOODS = {
  asleep:    { eyeW: 0.115, eyeBow: -0.055, lift:  0.000, bow:  0.020, open: 0.00, hue: 210, glow: 0.16 },
  idle:      { eyeW: 0.105, eyeBow:  0.030, lift:  0.000, bow:  0.075, open: 0.03, hue: 200, glow: 0.72 },
  listening: { eyeW: 0.120, eyeBow:  0.052, lift: -0.020, bow:  0.030, open: 0.05, hue: 195, glow: 1.00 },
  thinking:  { eyeW: 0.088, eyeBow:  0.010, lift: -0.034, bow: -0.030, open: 0.02, hue: 265, glow: 0.66 },
  talking:   { eyeW: 0.108, eyeBow:  0.036, lift:  0.000, bow:  0.070, open: 0.05, hue: 200, glow: 0.92 },
  waiting:   { eyeW: 0.116, eyeBow:  0.030, lift: -0.030, bow:  0.010, open: 0.04, hue:  35, glow: 0.98 },
  oops:      { eyeW: 0.092, eyeBow: -0.030, lift:  0.040, bow: -0.085, open: 0.03, hue:   5, glow: 0.74 },
};

let mood = 'asleep';
const now = { ...MOODS.asleep };
let gaze = { x: 0, y: 0, tx: 0, ty: 0 };
let blink = 0, nextBlink = 2200, t0 = performance.now();

// Live mouth shape, driven by the viseme scheduler below.
let mouth = { open: 0, wide: 1, tOpen: 0, tWide: 1 };

function setMood(m) {
  if (MOODS[m]) mood = m;
  const s = document.getElementById('status');
  s.textContent = { asleep: 'asleep', idle: 'here', listening: 'listening',
                    thinking: 'thinking', talking: 'talking',
                    waiting: 'waiting on you', oops: 'that went wrong' }[mood];
  s.classList.toggle('live', mood === 'listening' || mood === 'talking');
}

function draw(ts) {
  const dt = Math.min(64, ts - t0); t0 = ts;
  const k = 1 - Math.pow(0.001, dt / 1000);   // frame-rate independent easing
  const want = MOODS[mood];
  for (const p in want) now[p] += (want[p] - now[p]) * k;

  // The mouth chases its viseme target much harder than the mood eases, or
  // speech turns to mush.
  const mk = 1 - Math.pow(0.0000001, dt / 1000);
  mouth.open += (mouth.tOpen - mouth.open) * mk;
  mouth.wide += (mouth.tWide - mouth.wide) * mk;

  // Blink, and look somewhere else now and then.
  if (ts > nextBlink) {
    blink = 1;
    nextBlink = ts + 2000 + Math.random() * 4000;
    gaze.tx = (Math.random() - 0.5) * 0.7;
    gaze.ty = (Math.random() - 0.5) * 0.4;
  }
  blink = Math.max(0, blink - dt / 110);
  gaze.x += (gaze.tx - gaze.x) * k * 0.55;
  gaze.y += (gaze.ty - gaze.y) * k * 0.55;

  cx.clearRect(0, 0, cv.width, cv.height);
  const hue = now.hue, glow = now.glow;
  const breathe = 1 + Math.sin(ts / 1600) * 0.008;
  const ink = `hsl(${hue},88%,${56 + glow * 16}%)`;

  // the circle
  const rim = R * 0.93 * breathe;
  const fill = cx.createRadialGradient(R, R * 0.86, rim * 0.1, R, R, rim);
  fill.addColorStop(0, `hsl(${hue},26%,${8 + glow * 4}%)`);
  fill.addColorStop(1, '#0b0e12');
  cx.fillStyle = fill;
  cx.beginPath(); cx.arc(R, R, rim, 0, 7); cx.fill();

  cx.strokeStyle = `hsla(${hue},70%,60%,${0.10 + glow * 0.16})`;
  cx.lineWidth = R * 0.006;
  cx.beginPath(); cx.arc(R, R, rim, 0, 7); cx.stroke();

  cx.strokeStyle = ink;
  cx.lineCap = 'round';
  cx.lineJoin = 'round';
  cx.shadowColor = `hsla(${hue},95%,62%,${glow * 0.55})`;
  cx.shadowBlur = R * 0.07 * glow;

  // --- eyes: one stroke each ---
  // Blinking flattens the stroke and pulls it in, which on a line reads as a
  // shut eye without ever drawing a lid.
  const ey = R - R * 0.10 + gaze.y * R * 0.035;
  const ew = R * now.eyeW * (1 - 0.30 * blink);
  const bow = R * now.eyeBow * (1 - blink) - R * 0.055 * blink;

  cx.lineWidth = R * 0.030;
  const outer = R * now.lift * (1 - blink);
  for (const side of [-1, 1]) {
    const ex = R + side * R * 0.255 + gaze.x * R * 0.045;
    cx.beginPath();
    cx.moveTo(ex - ew, ey + (side < 0 ? outer : 0));
    cx.quadraticCurveTo(ex, ey + bow, ex + ew, ey + (side > 0 ? outer : 0));
    cx.stroke();
  }

  // --- mouth: one stroke, opening into a lens as it speaks ---
  const my = R + R * 0.30;
  const mw = R * 0.19 * mouth.wide;
  const op = R * 0.16 * (now.open + mouth.open);
  const mb = R * now.bow;

  cx.lineWidth = R * 0.030;
  cx.beginPath();
  cx.moveTo(R - mw, my);
  cx.quadraticCurveTo(R, my + mb - op * 0.55, R + mw, my);          // upper lip
  if (op > R * 0.012) {
    cx.quadraticCurveTo(R, my + mb + op * 1.0, R - mw, my);          // lower lip
    cx.closePath();
    cx.globalAlpha = 0.22; cx.fillStyle = ink; cx.fill(); cx.globalAlpha = 1;
  } else {
    // closed: a single bowed line
    cx.beginPath();
    cx.moveTo(R - mw, my);
    cx.quadraticCurveTo(R, my + mb, R + mw, my);
  }
  cx.stroke();
  cx.shadowBlur = 0;

  requestAnimationFrame(draw);
}
requestAnimationFrame(draw);

// ------------------------------------------------------------- the visemes --
// The browser won't hand over the audio it synthesises, so there's no waveform
// to measure. What it does give is a boundary event at the start of each word.
// So: take the word, turn its letters into mouth shapes, and play them out at
// roughly the rate the voice is speaking. Not phonetically perfect, but it's
// the difference between a mouth flapping and a mouth saying something.
//
// Each shape is [how far open, how wide].
const VISEME = {
  a: [0.95, 1.06], e: [0.52, 1.12], i: [0.30, 1.14], o: [0.88, 0.68], u: [0.50, 0.60],
  y: [0.34, 1.05],
  m: [0.00, 0.86], b: [0.02, 0.86], p: [0.02, 0.84],           // lips together
  f: [0.16, 0.92], v: [0.16, 0.92],                             // lip to teeth
  w: [0.32, 0.56], r: [0.36, 0.74], q: [0.40, 0.60],
  l: [0.44, 0.88], n: [0.26, 0.90], t: [0.22, 0.94], d: [0.30, 0.92],
  s: [0.14, 1.00], z: [0.16, 1.00], c: [0.20, 0.98], x: [0.20, 0.98],
  g: [0.38, 0.86], k: [0.30, 0.88], h: [0.42, 0.92], j: [0.30, 0.80],
};
const REST = [0.0, 1.0];

let visemes = [];        // queue of { at, shape }
let visTimer = null;

function scheduleWord(word, rate) {
  const per = 68 / rate;                    // ms per letter at the voice's pace
  let at = performance.now();
  for (const ch of word.toLowerCase()) {
    const v = VISEME[ch];
    if (!v) continue;                       // punctuation: hold the last shape
    visemes.push({ at, shape: v });
    at += per;
  }
  visemes.push({ at: at + per * 0.5, shape: REST });
}

function pumpVisemes() {
  const t = performance.now();
  while (visemes.length && visemes[0].at <= t) {
    const { shape } = visemes.shift();
    mouth.tOpen = shape[0];
    mouth.tWide = shape[1];
  }
}
visTimer = setInterval(pumpVisemes, 16);

function restMouth() {
  visemes.length = 0;
  mouth.tOpen = 0; mouth.tWide = 1;
}

// ------------------------------------------------------- ears (free, local) --
// Browser speech recognition and synthesis cost nothing. That is the single
// biggest reason this runs for pennies rather than $30/month.
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null, listening = false, heard = '';

if (SR) {
  rec = new SR();
  rec.lang = 'en-GB';
  rec.interimResults = true;
  rec.continuous = false;
  rec.onresult = e => { heard = [...e.results].map(r => r[0].transcript).join(''); show(heard, ''); };
  rec.onerror = e => {
    if (e.error === 'not-allowed') fail('microphone blocked — allow it in the address bar');
    else if (e.error !== 'aborted' && e.error !== 'no-speech') fail(e.error);
  };
  rec.onend = () => {
    listening = false;
    document.getElementById('talk').classList.remove('on');
    if (heard.trim()) ask(heard.trim());
    else if (mood === 'listening') setMood('idle');
  };
}

function startListening() {
  if (!rec || listening) return;
  if (speaking) stopSpeaking();
  heard = '';
  try { rec.start(); } catch { return; }
  listening = true;
  setMood('listening');
  document.getElementById('talk').classList.add('on');
}
function stopListening() { if (listening) try { rec.stop(); } catch {} }

// --------------------------------------------------------- mouth (free too) --
let speaking = false, voice = null;
function pickVoice() {
  const vs = speechSynthesis.getVoices();
  voice = vs.find(v => /Daniel|Serena|Google UK/i.test(v.name))
       || vs.find(v => v.lang.startsWith('en')) || vs[0];
}
speechSynthesis.onvoiceschanged = pickVoice; pickVoice();

function say(text) {
  return new Promise(res => {
    if (!text) return res();
    const rate = 1.02;
    const u = new SpeechSynthesisUtterance(text);
    u.voice = voice; u.rate = rate; u.pitch = 1.06;

    u.onboundary = e => {
      if (e.name && e.name !== 'word') return;
      const rest = text.slice(e.charIndex);
      const word = rest.slice(0, e.charLength || (rest.match(/^\S+/) || [''])[0].length);
      if (word) scheduleWord(word, rate);
    };
    u.onstart = () => { speaking = true; setMood('talking'); };
    u.onend = u.onerror = () => {
      speaking = false; restMouth(); setMood('idle'); res();
    };
    speechSynthesis.speak(u);
  });
}
function stopSpeaking() { speechSynthesis.cancel(); speaking = false; restMouth(); }

// --------------------------------------------------------------- the eyes ---
let stream = null;
const camEl = document.getElementById('cam');

async function toggleCam() {
  const btn = document.getElementById('eye');
  if (stream) {
    stream.getTracks().forEach(t => t.stop());
    stream = null; camEl.classList.remove('on'); btn.classList.remove('on');
    return;
  }
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { width: 640 } });
    const v = document.createElement('video');
    v.srcObject = stream; v.muted = true; v.playsInline = true; await v.play();
    camEl.classList.add('on'); btn.classList.add('on');
    const tick = () => {
      if (!stream) return;
      const c = document.createElement('canvas');
      c.width = 320; c.height = 320 * v.videoHeight / v.videoWidth;
      c.getContext('2d').drawImage(v, 0, 0, c.width, c.height);
      camEl.src = c.toDataURL('image/jpeg', 0.6);
      setTimeout(tick, 400);
    };
    tick();
  } catch { fail('no camera, or permission refused'); }
}

// A frame is only captured at the moment you ask something — never streamed.
// Vision tokens are the most expensive thing here, so they stay on demand.
function grabFrame() {
  if (!stream || !camEl.src) return null;
  return camEl.src.split(',')[1];
}
const WANTS_EYES = /\b(see|look|watch|this|holding|here|wearing|screen|show)\b/i;

// -------------------------------------------------------------- the brain ---
const cfg = JSON.parse(localStorage.getItem('deskmate') || '{}');
cfg.mode ??= 'demo';

const PRESETS = {
  anthropic: { url: 'https://api.anthropic.com/v1/messages', model: 'claude-haiku-4-5-20251001' },
  openai:    { url: 'https://api.openai.com/v1/chat/completions', model: 'gpt-4o-mini' },
};

const SYSTEM = `You are a small deskmate that lives on a screen on someone's desk.
You are spoken to out loud and your reply is read out loud, so: two or three
sentences at most, plain words, no lists, no markdown, no emoji. Warm and dry
rather than perky. If you can't do something, say so in one short line.
If you are shown a camera frame, mention what you actually see, briefly.`;

const history = [];
let turns = 0, spend = 0;

async function ask(text) {
  show(text, '');
  setMood('thinking');

  if (cfg.mode === 'demo') {
    await new Promise(r => setTimeout(r, 550));
    const reply = demoReply(text);
    tally(text.length / 4, reply.length / 4);
    show(text, reply);
    return say(reply);
  }

  const img = WANTS_EYES.test(text) ? grabFrame() : null;
  history.push({ role: 'user', text, img });
  if (history.length > 12) history.splice(0, history.length - 12);

  try {
    const reply = cfg.mode === 'anthropic' ? await callAnthropic() : await callOpenAI();
    history.push({ role: 'assistant', text: reply });
    show(text, reply);
    await say(reply);
  } catch (e) {
    history.pop();
    fail(String(e.message || e).slice(0, 120));
  }
}

async function callAnthropic() {
  const r = await fetch(cfg.url, {
    method: 'POST',
    headers: {
      'content-type': 'application/json',
      'x-api-key': cfg.key,
      'anthropic-version': '2023-06-01',
      'anthropic-dangerous-direct-browser-access': 'true',
    },
    body: JSON.stringify({
      model: cfg.model, max_tokens: 300, system: SYSTEM,
      messages: history.map(m => ({
        role: m.role,
        content: m.img
          ? [{ type: 'image', source: { type: 'base64', media_type: 'image/jpeg', data: m.img } },
             { type: 'text', text: m.text }]
          : m.text,
      })),
    }),
  });
  const j = await r.json();
  if (!r.ok) throw new Error(j.error?.message || r.status);
  tally(j.usage?.input_tokens, j.usage?.output_tokens);
  return j.content.map(c => c.text || '').join('').trim();
}

async function callOpenAI() {
  const r = await fetch(cfg.url, {
    method: 'POST',
    headers: { 'content-type': 'application/json', authorization: `Bearer ${cfg.key || 'none'}` },
    body: JSON.stringify({
      model: cfg.model, max_tokens: 300,
      messages: [{ role: 'system', content: SYSTEM }, ...history.map(m => ({
        role: m.role,
        content: m.img
          ? [{ type: 'text', text: m.text },
             { type: 'image_url', image_url: { url: 'data:image/jpeg;base64,' + m.img } }]
          : m.text,
      }))],
    }),
  });
  const j = await r.json();
  if (!r.ok) throw new Error(j.error?.message || r.status);
  tally(j.usage?.prompt_tokens, j.usage?.completion_tokens);
  return j.choices[0].message.content.trim();
}

function demoReply(t) {
  const s = t.toLowerCase();
  if (/hello|hi\b|hey/.test(s)) return "Hello. I'm running on canned replies until you give me a brain — the Brain button, down at the bottom.";
  if (/how much|cost|money/.test(s)) return "Right now, nothing at all. The listening and the talking are done by your browser for free. Only the thinking costs anything.";
  if (/who|what are you/.test(s)) return "A face in a browser tab. Modest, but I'm here.";
  if (/\?$/.test(t)) return "I'd need a real brain wired up to answer that properly. Demo mode only knows a handful of lines.";
  return "Noted. I'm in demo mode though, so I'm mostly nodding along.";
}

// Rough running total, so the number is never a surprise at the end of the month.
const RATES = { anthropic: [1, 5], openai: [0.15, 0.6], demo: [0, 0] };  // $ per Mtok
function tally(inTok = 0, outTok = 0) {
  turns++;
  const [ri, ro] = RATES[cfg.mode] || [0, 0];
  spend += (inTok * ri + outTok * ro) / 1e6;
  document.getElementById('c-turns').textContent = turns;
  document.getElementById('c-spend').textContent = '$' + spend.toFixed(4);
}

// ------------------------------------------------------ doing things safely --
// Nothing that changes a file or an email happens without you tapping yes.
// This is the hook the agent side plugs into later; it is deliberately the
// first thing built, not the last.
function requestApproval(what, body) {
  return new Promise(res => {
    setMood('waiting');
    stir();
    document.getElementById('ap-what').textContent = what;
    document.getElementById('ap-body').textContent = body;
    document.getElementById('approve').classList.add('on');
    const done = ok => {
      document.getElementById('approve').classList.remove('on');
      setMood('idle'); res(ok);
    };
    document.getElementById('ap-yes').onclick = () => done(true);
    document.getElementById('ap-no').onclick = () => done(false);
  });
}
window.requestApproval = requestApproval;

// ------------------------------------------------------------------ wiring --
function show(you, me) {
  document.getElementById('said').innerHTML =
    (you ? `<div class="you">${esc(you)}</div>` : '') + (me ? esc(me) : '');
  stir();
}
const esc = s => s.replace(/[<&]/g, c => ({ '<': '&lt;', '&': '&amp;' }[c]));

function fail(msg) {
  setMood('oops'); show('', msg);
  setTimeout(() => setMood('idle'), 2600);
}

// Let the chrome fall away when nothing is happening, so what's left is the
// circle. Any sign of life brings it back.
let quietTimer = null;
function stir() {
  document.body.classList.remove('quiet');
  clearTimeout(quietTimer);
  quietTimer = setTimeout(() => {
    if (!listening && !document.querySelector('dialog[open]')
        && !document.getElementById('approve').classList.contains('on')) {
      document.body.classList.add('quiet');
    }
  }, 3200);
}
['pointermove', 'pointerdown', 'keydown', 'wheel'].forEach(e => addEventListener(e, stir));
stir();

let woke = false;
function wake() {
  if (woke) return;
  woke = true; setMood('idle');
  say(cfg.mode === 'demo'
    ? "I'm awake, but I haven't got a brain yet. Hold the button and talk to me anyway."
    : "I'm here. Hold the button when you want me.");
}

// Tapping the face wakes it the first time, and shuts it up every time after —
// the only way to interrupt on a phone, where there's no escape key.
cv.onclick = () => {
  if (!woke) return wake();
  if (speaking) { stopSpeaking(); setMood('idle'); }
};

const talkBtn = document.getElementById('talk');
const press = e => { e.preventDefault(); wake(); startListening(); };
const release = e => { e.preventDefault(); stopListening(); };
talkBtn.addEventListener('pointerdown', press);
talkBtn.addEventListener('pointerup', release);
talkBtn.addEventListener('pointerleave', release);
talkBtn.addEventListener('pointercancel', release);

addEventListener('keydown', e => {
  if (e.code === 'Space' && !e.repeat && !document.querySelector('dialog[open]')) press(e);
  if (e.code === 'Escape') { stopSpeaking(); stopListening(); setMood('idle'); }
});
addEventListener('keyup', e => { if (e.code === 'Space') release(e); });

document.getElementById('eye').onclick = toggleCam;

const dlg = document.getElementById('dlg');
const $ = id => document.getElementById(id);
function syncDialog() {
  $('d-mode').value = cfg.mode;
  $('d-remote').hidden = cfg.mode === 'demo';
  const p = PRESETS[cfg.mode];
  if (p) {
    $('d-url').value = cfg.url || p.url;
    $('d-model').value = cfg.model || p.model;
    $('d-key').value = cfg.key || '';
    $('d-keynote').textContent = cfg.mode === 'openai' ? '— blank for Ollama / LM Studio' : '';
  }
}
$('cfg').onclick = () => { syncDialog(); dlg.showModal(); };
$('d-mode').onchange = () => { cfg.mode = $('d-mode').value; cfg.url = cfg.model = ''; syncDialog(); };
$('d-close').onclick = () => dlg.close();
$('d-save').onclick = () => {
  if (cfg.mode !== 'demo') {
    cfg.url = $('d-url').value.trim();
    cfg.model = $('d-model').value.trim();
    cfg.key = $('d-key').value.trim();
  }
  localStorage.setItem('deskmate', JSON.stringify(cfg));
  dlg.close();
  history.length = 0;
};

if (!SR) {
  document.getElementById('hint').innerHTML =
    'this browser has no speech recognition &mdash; use Chrome, or Chrome on Android';
} else if (!matchMedia('(hover: hover)').matches) {
  // a phone has no space bar to hold
  document.getElementById('hint').textContent = 'hold the button to talk · tap the face to interrupt';
}
setMood('asleep');
</script>
</body>
</html>
