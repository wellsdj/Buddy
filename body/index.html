<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#101827" />
    <title>Buddy — your desk companion</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="stage">
      <section class="orb" aria-label="Buddy desk companion">
        <div class="scenery" aria-hidden="true"></div>
        <div class="veil" aria-hidden="true"></div>
        <div class="grain" aria-hidden="true"></div>
        <div class="topline"><span id="date"></span></div>
        <div class="clock-wrap">
          <div id="clock" class="clock">12:48</div>
          <p id="greeting">good afternoon, wells</p>
        </div>
        <canvas class="voice-ring" id="voice-ring" aria-hidden="true"></canvas>
        <div class="sr-only" id="transcript" aria-live="polite"><p></p></div>
        <div class="sr-only" id="reply" aria-live="polite"><p></p></div>
        <div class="screen-rim" aria-hidden="true"></div>
      </section>
      <section class="notes">
        <p>Desk Buddy / prototype</p>
        <h1>A calm little presence<br />for your desk.</h1>
        <p>Always ready when you say <em>“hey buddy”</em>.</p>
        <button class="voice-toggle" id="voice-toggle" type="button" aria-pressed="true">Voice on</button>
      </section>
    </main>
    <dialog class="editor" id="artifact-editor" aria-labelledby="editor-title">
      <form method="dialog" class="editor-card">
        <div class="editor-heading">
          <div><p>Buddy draft</p><h2 id="editor-title">Edit email</h2></div>
          <button class="editor-close" value="cancel" aria-label="Close editor">×</button>
        </div>
        <label>To<input id="editor-recipient" autocomplete="off" /></label>
        <label>Subject<input id="editor-subject" autocomplete="off" /></label>
        <label>Message<textarea id="editor-body" rows="12"></textarea></label>
        <div class="editor-actions">
          <button class="editor-cancel" value="cancel">Cancel</button>
          <button class="editor-ok" id="editor-ok" value="default">OK, use this text</button>
        </div>
      </form>
    </dialog>
    <script src="app.js"></script>
  </body>
</html>
